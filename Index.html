<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Summary Card</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="card">

    <img src="https://i.postimg.cc/BnnTzt6K/Music-illustration.jpg" alt="Music Illustration" class="hero-image">

    <div class="content">

      <h1>Order Summary</h1>

      <p class="description">
        You can now listen to millions of songs, audiobooks,
        and podcasts on any device anywhere you like!
      </p>

      <div class="plan-box">

        <div class="plan-info">

          <div class="music-icon">
            🎵
          </div>

          <div>
            <h3>Annual Plan</h3>
            <p>$59.99/year</p>
          </div>

        </div>

        <a href="#">Change</a>

      </div>

      <button class="payment-btn">
        Proceed to Payment
      </button>

      <button class="cancel-btn">
        Cancel Order
      </button>

    </div>

  </div>

</body>

</html>
